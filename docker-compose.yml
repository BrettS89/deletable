services:
  deletable-api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: deletable-api  # optional
    depends_on:
      deletable-pg:
        condition: service_healthy
    env_file:
      - ./api/.env
    ports:
      - "4000:4000"
    restart: unless-stopped
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  deletable-web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: deletable-web  # optional
    env_file:
      - ./web/.env
    ports:
      - "5174:5174"
    restart: unless-stopped
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  deletable-pg:
    image: postgres:16
    container_name: deletable-pg  # optional
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: deletable
    volumes:
      - deletable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d deletable"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  api_node_modules:
  web_node_modules:
  deletable_pg_data:
